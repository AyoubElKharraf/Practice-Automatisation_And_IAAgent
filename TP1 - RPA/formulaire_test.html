<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulaire de test RPA</title>
  <style>
    body {
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1rem;
      font-family: sans-serif;
    }

    label {
      display: block;
      margin-top: 1rem;
    }

    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.65rem;
      font: inherit;
    }

    textarea {
      min-height: 8rem;
    }

    button {
      margin-top: 1rem;
      cursor: pointer;
    }

    #confirmation {
      margin-top: 1rem;
      color: #176b32;
    }
  </style>
</head>
<body>
  <h1>Formulaire de test RPA</h1>
  <p>Cette page est locale : les données saisies ne sont envoyées à aucun serveur.</p>

  <form id="formulaire">
    <label for="nom">Nom</label>
    <input id="nom" name="nom" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>

    <button id="submit" type="submit">Valider le formulaire</button>
  </form>

  <p id="confirmation" role="status" aria-live="polite"></p>

  <script>
    document.getElementById("formulaire").addEventListener("submit", (event) => {
      event.preventDefault();
      document.getElementById("confirmation").textContent =
        "Formulaire rempli avec succès (aucune donnée envoyée).";
    });
  </script>
</body>
</html>
